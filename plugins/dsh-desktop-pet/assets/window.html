<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dsh 桌宠</title>
<style>
  /* The pet's own look. `boot()` overwrites the bubble variables from its theme block, so one pet
     can be frosted glass and another a flat panel without either page being edited. */
  :root {
    color-scheme: dark; --bg: #14161c; --panel: #1c1f28; --line: #2b3040; --text: #e8ecf5; --dim: #98a2b8; --brand: #6aa3ff;
    --bubble: rgba(20, 24, 33, .72); --field: #141821; --bubble-text: #e9edf6; --accent: #6aa3ff; --radius: 16px; --glass: blur(18px) saturate(1.6); --msg-size: 13px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.6 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; background: radial-gradient(1100px 480px at 50% -12%, color-mix(in srgb, var(--bg) 80%, #35405c), var(--bg)); }
  header {
    display: flex; align-items: center; gap: 8px; padding: 9px 13px;
    border-bottom: 1px solid rgba(244, 255, 255, .12); -webkit-app-region: drag;
  }
  header::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  header .name { font-weight: 600; letter-spacing: .08em; text-shadow: 0 1px 0 rgba(0, 0, 0, .33); }
  header .spacer { flex: 1; }
  header button, .row button { -webkit-app-region: no-drag; }
  button {
    background: transparent; border: 1px solid rgba(244, 255, 255, .28); color: rgba(244, 255, 255, .78);
    border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px;
    text-shadow: 0 1px 0 rgba(0, 0, 0, .33);
    transition: color .15s, border-color .15s, box-shadow .15s;
  }
  button:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 40%, transparent); }
  button.on { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 50%, transparent); }
  /* A fixed stage, not a floating one: an <img> that has not decoded yet is 0×0, and a frame run
     that collapses and re-expands twelve times a second makes the whole page jump. */
  #stage { display: flex; align-items: center; justify-content: center; padding: 10px; height: 210px; flex: none; }
  #stage img { width: 190px; height: 190px; object-fit: contain; border-radius: 12px; filter: drop-shadow(0 12px 26px rgba(0, 0, 0, .42)); }
  /* Sprite motions: one drawing, animated by the page. `motion` on a pet's expression/action. */
  @keyframes dshBreathe { 0%,100% { transform: scale(1) translateY(0) } 50% { transform: scale(1.035) translateY(-2px) } }
  @keyframes dshBob     { 0%,100% { transform: translateY(0) rotate(0) } 25% { transform: translateY(-7px) rotate(-1.5deg) } 75% { transform: translateY(-3px) rotate(1.5deg) } }
  @keyframes dshNod     { 0%,100% { transform: rotate(0) translateY(0) } 30% { transform: rotate(4deg) translateY(2px) } 60% { transform: rotate(1deg) translateY(0) } }
  @keyframes dshSway    { 0%,100% { transform: rotate(-2.5deg) translateX(-3px) } 50% { transform: rotate(2.5deg) translateX(3px) } }
  @keyframes dshShake   { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-4px) rotate(-1deg) } 40% { transform: translateX(4px) rotate(1deg) } 60% { transform: translateX(-3px) } 80% { transform: translateX(3px) } }
  @keyframes dshBurst   { 0%,100% { transform: scale(1) translateX(0) } 10% { transform: scale(1.06) translateX(-6px) rotate(-2deg) } 30% { transform: scale(1.06) translateX(6px) rotate(2deg) } 50% { transform: scale(1.03) translateX(-4px) } 70% { transform: scale(1.03) translateX(4px) } }
  @keyframes dshPop     { 0%,100% { transform: scale(1,1) translateY(0) } 30% { transform: scale(1.08,.92) translateY(4px) } 55% { transform: scale(.94,1.09) translateY(-9px) } 80% { transform: scale(1.02,.98) translateY(0) } }
  @keyframes dshWobble  { 0%,100% { transform: rotate(0) skewX(0) } 25% { transform: rotate(-5deg) skewX(2deg) } 50% { transform: rotate(3deg) skewX(-2deg) } 75% { transform: rotate(-2deg) skewX(1deg) } }
  @keyframes dshStretch { 0%,100% { transform: scale(1,1) translateY(0) } 35% { transform: scale(.96,1.08) translateY(-8px) } 60% { transform: scale(1.05,.95) translateY(2px) } }
  @keyframes dshSleep   { 0%,100% { transform: scale(1) rotate(-1deg) } 50% { transform: scale(1.02) rotate(1deg) } }
  .motion-breathe { animation: dshBreathe 4s ease-in-out infinite }
  .motion-bob     { animation: dshBob 1.6s ease-in-out infinite }
  .motion-nod     { animation: dshNod 2.4s ease-in-out infinite }
  .motion-sway    { animation: dshSway 3.4s ease-in-out infinite }
  .motion-shake   { animation: dshShake .45s ease-in-out infinite }
  .motion-burst   { animation: dshBurst .6s ease-in-out infinite }
  .motion-pop     { animation: dshPop 1.1s ease-in-out infinite }
  .motion-wobble  { animation: dshWobble 1.5s ease-in-out infinite }
  .motion-stretch { animation: dshStretch 3s ease-in-out infinite }
  .motion-sleep   { animation: dshSleep 6s ease-in-out infinite }
  @media (prefers-reduced-motion: reduce) { [class*="motion-"] { animation: none } }
  #stage .placeholder { width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #7fb0ff, #3f63c8); box-shadow: 0 8px 30px rgba(60,110,220,.35); position: relative; }
  #stage .placeholder::before, #stage .placeholder::after { content: ""; position: absolute; top: 44px; width: 22px; height: 26px; border-radius: 50%; background: #fff; }
  #stage .placeholder::before { left: 30px; } #stage .placeholder::after { right: 30px; }
  #log { flex: 1; overflow-y: auto; padding: 4px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
  /* Glass, not a box: a translucent fill over a blurred backdrop, with the corner the owner picked
     and one square corner on the side the message comes from. */
  .msg {
    padding: 9px 13px; max-width: 86%; white-space: pre-wrap; word-break: break-word;
    font-size: var(--msg-size); line-height: 1.65; color: var(--bubble-text);
    text-shadow: 0 1px 0 rgba(0, 0, 0, .33);
    background: linear-gradient(180deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, 0) 46%), var(--bubble);
    backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
    border: 1px solid rgba(255, 255, 255, .13); box-shadow: 0 10px 30px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .07);
    animation: dshRise .30s cubic-bezier(.16, 1, .3, 1) both;
  }
  /* With a drawn UI the artwork IS the bubble: one drawing stretched by border-image, corners kept. */
  body.ui-art .msg {
    background: color-mix(in srgb, var(--bubble) 88%, transparent);
    backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
    box-shadow: none; border-radius: calc(var(--radius) + 4px);
    padding: 2px 6px; border-style: solid; border-width: 20px;
    border-image-source: var(--ui-bubble); border-image-slice: var(--ui-slice) fill; border-image-repeat: stretch;
  }
  body.ui-art input[type=text] {
    background: color-mix(in srgb, var(--field) 90%, transparent); border-style: solid; border-width: 15px; border-radius: calc(var(--radius) + 4px); box-shadow: none;
    border-image-source: var(--ui-input); border-image-slice: var(--ui-slice) fill; border-image-repeat: stretch;
  }
  body.ui-art .row button {
    background: color-mix(in srgb, var(--bubble) 70%, transparent); border-style: solid; border-width: 13px; border-radius: calc(var(--radius) + 2px); color: var(--bubble-text); box-shadow: none;
    border-image-source: var(--ui-button); border-image-slice: var(--ui-slice) fill; border-image-repeat: stretch;
  }
  .msg.pet { align-self: flex-start; border-radius: var(--radius) var(--radius) var(--radius) 4px; }
  .msg.me {
    align-self: flex-end; border-radius: var(--radius) var(--radius) 4px var(--radius);
    background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, 0) 46%), color-mix(in srgb, var(--accent) 26%, var(--bubble));
    border-color: color-mix(in srgb, var(--accent) 40%, rgba(255, 255, 255, .13));
    box-shadow: 0 8px 26px color-mix(in srgb, var(--accent) 25%, transparent), inset 0 1px 0 rgba(255, 255, 255, .09);
  }
  @keyframes dshRise {
    0% { opacity: 0; transform: translateY(4px); clip-path: inset(0 100% 0 0) }
    45% { opacity: 1; clip-path: inset(0 30% 0 0) }
    100% { opacity: 1; transform: none; clip-path: inset(0 0 0 0) }
  }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none } }
  .msg img { max-width: 100%; border-radius: 8px; display: block; margin-top: 6px; }
  .row { display: flex; gap: 6px; padding: 9px 11px; border-top: 1px solid rgba(244, 255, 255, .12); }
  /* The one thing that is never translucent. Text being typed has to stay readable over whatever
     happens to be behind the window, and a frosted field turns it to mush. */
  input[type=text] {
    flex: 1; background: var(--field); border: 1px solid rgba(255, 255, 255, .16);
    border-radius: calc(var(--radius) - 4px); color: var(--text); padding: 9px 12px; font: inherit;
  }
  input[type=text] { transition: border-color .18s, box-shadow .18s; }
  input[type=text]:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 75%, transparent), 0 0 16px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .row button { border-radius: calc(var(--radius) - 4px); }
  .perm {
    background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, 0) 50%), color-mix(in srgb, #d9a441 18%, var(--bubble));
    border: 1px solid rgba(217, 164, 65, .5); box-shadow: 0 0 18px rgba(217, 164, 65, .15);
  }
  .dim { color: var(--dim); font-size: 12px; }
  .ic { width: 16px; height: 16px; display: block; opacity: .82; }
  button:hover .ic, button.on .ic { opacity: 1; filter: drop-shadow(0 0 4px var(--accent)); }
  /* Art mode flattens every bubble; the consent card keeps its amber warning glow and
     its buttons stay readable controls rather than a second border-image. */
  body.ui-art .msg.perm { box-shadow: 0 0 18px rgba(217, 164, 65, .4); }
  body.ui-art .msg.perm button { background: rgba(0, 0, 0, .28); border: 1px solid rgba(217, 164, 65, .5); border-radius: 8px; box-shadow: none; }
  body:not(.ui-art) #send {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    color: var(--text); border: 1px solid var(--accent); font-weight: 600; padding: 4px 14px;
    text-shadow: 0 1px 0 rgba(0, 0, 0, .33);
  }
  body:not(.ui-art) #send:hover { box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 55%, transparent); }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .12); border-radius: 4px; }
  #log::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, .22); }
  #log::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<header>
  <span class="name" id="pet-name">桌宠</span>
  <span class="dim" id="state"></span>
  <span class="spacer"></span>
  <button id="mic" title="按住说话,双击开启持续聆听"><img class="ic" src="/dsh-desktop-pet/icon?name=mic" alt="语音"></button>
  <button id="mute" title="静音"><img class="ic" src="/dsh-desktop-pet/icon?name=speaker" alt="静音"></button>
  <button id="newchat" title="新建对话"><img class="ic" src="/dsh-desktop-pet/icon?name=plus" alt="新建对话"></button>
</header>
<div id="stage"><div class="placeholder"></div></div>
<div id="log"></div>
<div class="row">
  <input type="text" id="say" placeholder="输入消息…" autocomplete="off">
  <button id="send">发送</button>
</div>
<script>
// The pet page: it talks only to this dsh instance over loopback, and holds no state of its own.
const params = new URLSearchParams(location.search)
const PET = params.get('pet') || ''
const MSG_ZH = { 'no such conversation': '未找到该对话', 'nothing to say': '消息内容为空', 'transcription failed': '语音转写失败', 'no audio': '没有音频内容', 'same-origin requests only': '仅允许同源请求', 'body too large': '请求体过大' }
const msgZh = m => MSG_ZH[m] || m || ''
const mediaStub = kind => (kind === 'img' ? '(图片)' : kind === 'vid' ? '(视频)' : kind === 'aud' ? '(音频)' : '(媒体文件)')
const api = async (path, body) => {
  const init = body === undefined ? { cache: 'no-store' } : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }
  const r = await fetch('/dsh-desktop-pet' + path, init)
  try { return await r.json() } catch { return { ok: false, message: 'HTTP ' + r.status } }
}
const $ = id => document.getElementById(id)
const log = $('log')
let since = 0, muted = false, petId = PET, audioEl = new Audio()

function addJump() {
  const div = document.createElement('div')
  div.className = 'dim'
  div.style.alignSelf = 'flex-start'
  const b = document.createElement('button')
  b.textContent = '查看对话'
  b.onclick = () => window.open('/', '_blank')
  div.appendChild(b)
  log.appendChild(div)
  log.scrollTop = log.scrollHeight
}
function add(kind, text, imageUrl) {
  const div = document.createElement('div')
  div.className = 'msg ' + kind
  div.textContent = text
  if (imageUrl) { const img = document.createElement('img'); img.src = imageUrl; div.appendChild(img) }
  log.appendChild(div)
  log.scrollTop = log.scrollHeight
  while (log.children.length > 120) log.removeChild(log.firstChild)
  return div
}

function permissionCard(id, detail) {
  const div = add('msg pet perm', detail)
  div.className = 'msg pet perm'
  const yes = document.createElement('button'); yes.textContent = '同意'
  const no = document.createElement('button'); no.textContent = '拒绝'
  yes.onclick = async () => { await api('/permission', { id, allowed: true }); div.textContent = '已同意 · ' + detail }
  no.onclick = async () => { await api('/permission', { id, allowed: false }); div.textContent = '已拒绝 · ' + detail }
  div.append(' ', yes, ' ', no)
}

async function boot() {
  const s = await api('/status')
  if (s.ok === false) { add('pet', '桌宠服务未连接' + (s.message ? ':' + msgZh(s.message) : '')) ; return }
  petId = petId || s.config.activeId
  const pet = (s.config.pets || []).find(p => p.id === petId) || s.active
  const petName = (pet && pet.name) || '桌宠'   // the desktop host looks for exactly "<name> · dsh"
  $('pet-name').textContent = petName
  document.title = petName + ' · dsh'
  // Start from the queue's current position — a reopened window must not replay old lines — but a
  // permission request that is still waiting for an answer has to be shown.
  const current = await api('/window-state?pet=' + encodeURIComponent(petId) + '&since=0')
  since = current.seq ?? 0
  const open = new Set((s.pending || []).map(x => x.id))
  for (const item of current.items || []) {
    if (item.permission && open.has(item.permission)) permissionCard(item.permission, item.text || item.effect || '桌宠请求权限')
  }
  applyTheme(pet && pet.theme)
  // Show the pet straight away rather than the placeholder: without this it stays a blue blob
  // until it happens to speak, which on a quiet setting is half an hour away.
  bridge = ((pet && pet.expressions) || []).find(e => e.name === '站立过渡') || null
  const boot = pet && ((pet.expressions || [])[0] || (pet.actions || [])[0])
  if (boot) setSprite(boot.name, boot.motion, boot.frames, boot.fps, boot.loop)
  const chat = await api('/chat?pet=' + encodeURIComponent(petId))
  if (chat.ok !== false) for (const m of (chat.chat.messages || []).slice(-20)) {
    const match = /\[\[dsh-media:(([a-z]{3})-[^\]]+)\]\]/.exec(m.text || '')
    const clean = String(m.text || '').replace(/\[\[dsh-media:[^\]]+\]\]/g, '').trim()
    add(m.role === 'assistant' ? 'pet' : 'me', clean || mediaStub(match && match[2]), match && match[2] === 'img' ? '/dsh-media-lab/file/' + match[1] : undefined)
  }
  if (pet && pet.persona && pet.persona.greeting && (!chat.chat || chat.chat.messages.length === 0)) add('pet', pet.persona.greeting)
  poll()
}

async function poll() {
  try {
    const state = await api('/window-state?pet=' + encodeURIComponent(petId) + '&since=' + since)
    if (state.ok !== false) {
      since = state.seq ?? since
      for (const item of state.items || []) {
        // item.text already opens with the effect sentence the plugin wrote; do not repeat it.
        if (item.permission) { permissionCard(item.permission, item.text || item.effect || '桌宠请求权限'); continue }
        if (item.text) {
          const match = /\[\[dsh-media:([a-z]{3}-\d{8}-\d{6}-[0-9a-f]{6})\]\]/.exec(item.text)
          add('pet', item.text.replace(/\[\[dsh-media:[^\]]+\]\]/, '').trim() || mediaStub(match && match[1].slice(0, 3)), match ? '/dsh-media-lab/file/' + match[1] : undefined)
          if (item.source === 'task') addJump()
        }
        if (item.expression) setSprite(item.expression, item.motion, item.frames, item.fps, item.loop)
        if (item.audio && !muted) { audioEl.src = item.audio; audioEl.play().catch(() => {}) }
        if (item.stop) window.close()
      }
    }
  } catch { /* dsh may be restarting */ }
  setTimeout(poll, 1500)
}

let animTimer = null
const stillPlease = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches

/** Show a sprite. One drawing gets its CSS motion; several are played as real frames. */
/** Paint the pet's own look onto the page. Anything missing keeps the stylesheet's default. */
function applyTheme(theme) {
  if (!theme || typeof theme !== 'object') return
  const hex = String(theme.bg || '')
  const rgb = /^#[0-9a-f]{6}$/i.test(hex) ? [1, 3, 5].map(n => parseInt(hex.slice(n, n + 2), 16)).join(', ') : null
  const root = document.documentElement.style
  if (rgb) root.setProperty('--bubble', 'rgba(' + rgb + ', ' + (Number(theme.opacity) || 0.72) + ')')
  // The field takes the same colour at full strength: same family, always readable.
  if (theme.bg) root.setProperty('--field', theme.bg)
  if (theme.text) root.setProperty('--bubble-text', theme.text)
  if (theme.accent) root.setProperty('--accent', theme.accent)
  if (theme.radius !== undefined) root.setProperty('--radius', Math.round(theme.radius) + 'px')
  if (theme.fontSize !== undefined) root.setProperty('--msg-size', Math.round(theme.fontSize) + 'px')
  root.setProperty('--glass', Number(theme.blur) > 0 ? 'blur(' + Math.round(theme.blur) + 'px) saturate(1.6)' : 'none')
  // The drawn set, when the pet has one: three pictures, each stretched from the same slice inset.
  const art = part => 'url("/dsh-desktop-pet/ui?pet=' + encodeURIComponent(petId) + '&part=' + part + '")'
  root.setProperty('--ui-bubble', art('bubble'))
  root.setProperty('--ui-input', art('input'))
  root.setProperty('--ui-button', art('button'))
  root.setProperty('--ui-slice', Math.round(theme.slice ?? 28) + '%')
  document.body.classList.toggle('ui-art', theme.ui === 'art')
}

let bridge = null           // the standing-transition expression, when the pet has one
let bridgeTimer = null
let currentSprite = ''
function setSprite(name, motion, frames, fps, loop) {
  // A different animation goes through the standing bridge first: the outgoing run ends,
  // the bridge plays once, then the incoming run starts — no hard cut.
  if (bridgeTimer) { clearTimeout(bridgeTimer); bridgeTimer = null }
  if (bridge && currentSprite && name !== currentSprite && name !== bridge.name) {
    const wasSprite = currentSprite
    currentSprite = name
    playSprite(bridge.name, bridge.motion, bridge.frames, bridge.fps, 'forward')
    const holdMs = Math.max(200, Math.round(1000 * (Number(bridge.frames) || 6) / Math.max(1, Number(bridge.fps) || 12)))
    bridgeTimer = setTimeout(() => { bridgeTimer = null; playSprite(name, motion, frames, fps, loop) }, holdMs)
    return void wasSprite
  }
  currentSprite = name
  playSprite(name, motion, frames, fps, loop)
}
function playSprite(name, motion, frames, fps, loop) {
  const stage = $('stage')
  if (animTimer) { clearInterval(animTimer); animTimer = null }
  const count = stillPlease ? 1 : Math.max(1, Math.min(24, Math.round(Number(frames) || 1)))
  const url = n => '/dsh-desktop-pet/sprite?pet=' + encodeURIComponent(petId) + '&name=' + encodeURIComponent(name) + '&frame=' + n
  // The CSS motion is the single-drawing fallback: over real frames it would fight the animation.
  const className = count === 1 && motion && motion !== 'none' && !stillPlease ? 'motion-' + String(motion).replace(/[^a-z]/g, '') : ''
  // Every frame is its own element, loaded once and then only shown or hidden. Swapping one img's
  // src would re-request the file on every tick — sprites are served no-store, so nothing is cached.
  const shots = []
  for (let n = 1; n <= count; n++) {
    const img = new Image()
    img.className = className
    img.style.display = n === 1 ? '' : 'none'
    // A frame count larger than the drawings that actually exist would otherwise blink a broken
    // image into the pet; the run is cut back to what loaded instead.
    if (n > 1) img.onerror = () => { cut(n - 1) }
    img.src = url(n)
    shots.push(img)
  }
  shots[0].onload = () => { shots[0].onload = null; stage.innerHTML = ''; for (const s of shots) stage.appendChild(s) }
  shots[0].onerror = () => { stage.innerHTML = '<div class="placeholder"></div>' }
  if (count === 1) return
  // Drawn runs rarely end where they began: playing forwards and back joins seamlessly.
  let order = []
  const plan = have => {
    const list = []
    for (let n = 0; n < have; n++) list.push(n)
    if (String(loop) !== 'forward') for (let n = have - 2; n > 0; n--) list.push(n)
    return list
  }
  let liveCount = 0
  const cut = have => {
    // Against the CURRENT count: with several frames missing every one of them calls this, and
    // comparing against the original count let the largest index win.
    if (have >= liveCount || have < 1) return
    liveCount = have
    for (let n = have; n < shots.length; n++) shots[n].style.display = 'none'
    order = plan(have)
    at = 0
    // The frame on screen may be one of the ones just dropped: land back on the first.
    shots[0].style.display = ''
    if (have < 2 && animTimer) { clearInterval(animTimer); animTimer = null }
  }
  liveCount = count
  order = plan(count)
  let at = 0
  animTimer = setInterval(() => {
    shots[order[at]].style.display = 'none'
    at = (at + 1) % order.length
    shots[order[at]].style.display = ''
  }, Math.max(33, Math.round(1000 / Math.min(30, Math.max(1, Number(fps) || 12)))))
}

async function send() {
  const input = $('say')
  const text = input.value.trim()
  if (!text) return
  input.value = ''
  add('me', text)
  $('state').textContent = '思考中…'
  const out = await api('/say', { pet: petId, text })
  $('state').textContent = ''
  if (out.ok === false) add('pet', '请求失败:' + msgZh(out.message))
}
$('send').onclick = send
$('say').addEventListener('keydown', e => { if (e.key === 'Enter') send() })
$('mute').onclick = () => { muted = !muted; $('mute').querySelector('.ic').src = '/dsh-desktop-pet/icon?name=' + (muted ? 'speaker-off' : 'speaker'); $('mute').title = muted ? '取消静音' : '静音'; $('mute').classList.toggle('on', muted) }
$('newchat').onclick = async () => { const r = await api('/chat/new', { pet: petId }); if (r.ok === false) { add('pet', '请求失败:' + msgZh(r.message)) } else { log.innerHTML = ''; add('pet', '(已新建对话)') } }

// ── voice: hold the button for one utterance, double-click for always-on ──
let recorder = null, chunks = [], always = false
async function startRecording() {
  if (recorder) return
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
  recorder = new MediaRecorder(stream)
  chunks = []
  recorder.ondataavailable = e => chunks.push(e.data)
  recorder.onstop = async () => {
    const blob = new Blob(chunks, { type: 'audio/webm' })
    for (const track of recorder.stream.getTracks()) track.stop()
    recorder = null
    if (blob.size < 1200) return
    const base64 = await blobToBase64(blob)
    $('state').textContent = '聆听中…'
    const heard = await api('/listen', { pet: petId, base64, ext: 'webm' })
    $('state').textContent = ''
    if (heard.ok === false || !heard.text) { add('pet', '未能识别语音' + (heard.message ? ':' + msgZh(heard.message) : '')); return }
    add('me', heard.text)
    $('state').textContent = '思考中…'
    await api('/say', { pet: petId, text: heard.text })
    $('state').textContent = ''
    if (always) setTimeout(() => startRecording().then(() => setTimeout(stopRecording, 6000)), 400)
  }
  recorder.start()
  $('mic').classList.add('on')
  $('mic').querySelector('.ic').src = '/dsh-desktop-pet/icon?name=mic-live'
}
function stopRecording() { $('mic').classList.remove('on'); $('mic').querySelector('.ic').src = '/dsh-desktop-pet/icon?name=mic'; if (recorder && recorder.state !== 'inactive') recorder.stop() }
const blobToBase64 = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.readAsDataURL(blob) })
$('mic').addEventListener('mousedown', () => { if (!always) startRecording() })
$('mic').addEventListener('mouseup', () => { if (!always) stopRecording() })
$('mic').addEventListener('dblclick', () => {
  always = !always
  $('mic').title = always ? '持续聆听中,双击停止' : '按住说话,双击开启持续聆听'
  if (always) startRecording().then(() => setTimeout(stopRecording, 6000)); else stopRecording()
})
boot()
</script>
